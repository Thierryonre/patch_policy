[project]
name = "patch-policy"
version = "0.1.0"
description = "Efficient embodied control via dense visual representations"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "absl-py==2.1.0",
    "accelerate==0.26.1",
    "av==12.0.0",
    "bddl==1.0.1",
    "cloudpickle==2.1.0",
    "diffusers==0.36.0",
    "dm-control==1.0.27",
    "easydict==1.9",
    "egl-probe==1.0.2; sys_platform == 'linux'",
    "einops==0.8.2",
    "gym==0.23.1",
    "gymnasium==1.1.1",
    "h5py==3.11.0",
    "hdf5plugin==6.0.0",
    "huggingface-hub==0.36.2",
    "hydra-core==1.2.0",
    "hydra-submitit-launcher==1.2.0",
    "imageio==2.34.1",
    "imageio-ffmpeg==0.4.9",
    "lxml==5.3.1",
    "matplotlib==3.9.4",
    "mujoco==3.2.7",
    "numba==0.60.0",
    "numcodecs==0.12.1",
    "numpy==1.26.4",
    "ogbench==1.2.1",
    "omegaconf==2.3.0",
    "opencv-python==4.10.0.84",
    "pillow==10.3.0",
    "prettytable==3.16.0",
    "pybullet==3.2.7",
    "pygame==2.5.2",
    "pymunk==6.8.0",
    "pyopengl==3.1.7",
    "pyyaml==6.0.1",
    "robosuite==1.4.1",
    "safetensors==0.4.3",
    "scikit-image==0.24.0",
    "scikit-learn==1.5.0",
    "scipy==1.13.1",
    "setuptools==70.0.0",
    "shapely==2.0.7",
    "six==1.16.0",
    "submitit==1.5.1",
    "termcolor==2.4.0",
    "timm==1.0.27",
    "torch==2.7.1+cu128",
    "torchcodec==0.5.0; sys_platform == 'linux'",
    "torchvision==0.22.1+cu128",
    "tqdm==4.66.4",
    "transformers==4.57.6",
    "wandb==0.26.1",
    "zarr==2.18.2",
]

[dependency-groups]
dev = ["pytest==8.2.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
